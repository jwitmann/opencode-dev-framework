name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:md
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub release notes
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract this version's CHANGELOG section
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          awk -v tag="$TAG" 'index($0, "## [" tag "]") == 1 {flag=1; next} /^## \[/ {flag=0} flag' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "No CHANGELOG section for $TAG; falling back to generated notes."
          fi

      - name: Create (or update) the GitHub release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -s /tmp/notes.md ]; then NOTES_ARGS="--notes-file /tmp/notes.md";
          else NOTES_ARGS="--generate-notes"; fi
          # shellcheck disable=SC2086
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" $NOTES_ARGS
          else
            gh release create "$TAG" --title "$TAG" $NOTES_ARGS
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

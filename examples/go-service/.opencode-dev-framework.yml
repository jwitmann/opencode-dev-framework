# Example opencode-dev-framework configuration for a Go service.
# Copy this file to your project root and adjust commands to your tooling.

profile: standard

commands:
  typecheck: "go build ./..."
  test: "go test ./..."
  test_changed: "go test ./... -run Test -count=1"
  lint:
    ".go": "golangci-lint run {dir}"
  format:
    ".go": "gofmt -w {file}"

protect:
  - ".env*"
  - "**/.env*"
  - "deploy/prod/**"
  - "migrations/**"

exclude:
  - "**/*_test.go"
  - "**/testdata/**"

gate:
  run_typecheck: true
  run_tests: true
  block_on_failure: true
  skip_unchanged: true
  scope: all
  lint_changed: false
  timeout: 300
  max_blocks: 3
  # Named project-specific acceptance checks. Each runs after the built-in
  # steps (typecheck, tests, changed-file lint), sequentially in declaration
  # order; a failure is aggregated, it does not abort the remaining steps.
  # `{files}` expands to the changed-file list, like the test command.
  # acceptance:
  #   - name: api-contract
  #     command: ./scripts/verify-api-contract.sh
  #   - name: migration-safety
  #     command: ./scripts/check-migrations.sh
  #     timeout: 120

precommit: off

on_edit:
  format: true
  lint: true

# Default opencode-dev-framework configuration.
# Edit the commands to match your project's toolchain.

profile: standard

commands:
  typecheck: ""
  test: ""
  test_changed: ""
  lint:
    default: ""
  format:
    default: ""

protect:
  - ".env*"
  - "**/.env*"
  - "**/node_modules/**"
  - "**/vendor/**"

exclude: []

gate:
  run_typecheck: true
  run_tests: true
  block_on_failure: true
  skip_unchanged: true
  scope: all
  lint_changed: false
  timeout: 300
  max_blocks: 3

on_edit:
  format: true
  lint: true
